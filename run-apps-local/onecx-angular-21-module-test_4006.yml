####################################################
# Integrate a local running Microfrontend into OneCX
####################################################
# Microfrontend: "onecx-angular-21-module-test-ui"
http:
  routers:
    local_onecx-angular-21-module-test-ui:
      # path prefix as used for MFE registration in product store
      rule: "Host(`onecx.localhost`) && PathPrefix(`/mfe/onecx-angular-21-module-test/`)"
      service: local_onecx-angular-21-module-test-ui
      # higher prio than calculated based on rule length (traefik standard)
      priority: 323
      entryPoints:
        - web
      middlewares:
        - strip_onecx-angular-21-module-test-ui

  # Remove the used mfe path so that it maps directly to localhost:port
  middlewares:
    strip_onecx-angular-21-module-test-ui:
      stripPrefix:
        prefixes:
          - "/mfe/onecx-angular-21-module-test"

  services:
    local_onecx-angular-21-module-test-ui:
      loadBalancer:
        servers:
        - url: "http://onecx.localhost:4006/"   # Angular project started outside Docker with this port
